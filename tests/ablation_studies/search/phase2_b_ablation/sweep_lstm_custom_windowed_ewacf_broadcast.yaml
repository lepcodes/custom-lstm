# ─── Phase 2b: Windowed + EW-ACF Broadcast Ablation ──────────────────────
# Goal: Can EW-ACF improve models that already use windowed inputs?

data_path: "C:\\Users\\Luis\\Documents\\ML-AI-Projects\\custom-lstm\\data\\preprocessed\\aqua_alta.csv"
experiment_name: "Phase 2b - Ablation"
architecture: "lstm_custom_windowed"
data_mode: "win"
loss_type: "ewacf_broadcast"

# Fixed hyperparameters (Determined from Phase 2a)
output_size: 1
epochs: 200
patience: 30

# Ablation Grid (18 runs)
grid:
  hidden_size: [128] # PLACEHOLDER
  lr: [0.001]        # PLACEHOLDER
  bptt_steps: [50]   # PLACEHOLDER
  window_size: [10]
  
  # EW-ACF Variables Sweep
  forget_gate_layers: [[]]
  ewacf_alpha: [0.01, 0.1, 0.2]
  ewacf_lambda: [0.95, 0.99, 0.999]
  ewacf_threshold: [0.1, 0.3]
  ewacf_lag: [10, 11, 12]