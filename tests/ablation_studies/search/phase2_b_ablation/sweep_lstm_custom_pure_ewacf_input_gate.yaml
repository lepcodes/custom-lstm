# ─── Phase 2b: Pure + EW-ACF Input Gate Ablation ───────────────────────────
# Goal: Find optimal Input Gate regularization for fixed architecture.

data_path: "C:\\Users\\Luis\\Documents\\ML-AI-Projects\\custom-lstm\\data\\preprocessed\\synthetic_dataset_lag.csv"
experiment_name: "Phase 2b - Ablation"
architecture: "lstm_custom_pure"
data_mode: "pure"
loss_type: "ewacf_input_gate"

# Fixed hyperparameters (Determined from Phase 2a)
output_size: 1
epochs: 200
patience: 30

# Ablation Grid (18 runs)
grid:
  hidden_size: [128] # PLACEHOLDER
  lr: [0.005]        # PLACEHOLDER
  bptt_steps: [50]   # PLACEHOLDER
  
  # EW-ACF Variables Sweep
  forget_gate_layers: [[]]
  ewacf_alpha: [0.01, 0.1, 0.2]
  ewacf_lambda: [0.8, 0.95, 0.99]
  ewacf_threshold: [0.1, 0.2, 0.3]
  ewacf_lag: [20]
