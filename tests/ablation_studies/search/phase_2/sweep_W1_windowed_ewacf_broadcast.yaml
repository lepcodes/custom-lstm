# ─── Sweep W-1: Custom LSTM Windowed + EW-ACF Broadcast (Lag ≥ W) ─────────
# Usage: python sweep.py --config search/phase_2/sweep_W1_windowed_ewacf_broadcast.yaml

data_path: "C:\\Users\\Luis\\Documents\\ML-AI-Projects\\custom-lstm\\data\\preprocessed\\ethernet_traffic.csv"
architecture: "lstm_custom_windowed"
data_mode: "win"
loss_type: "ewacf_broadcast"

# EW-ACF hyperparameters
# NOTE: lag is enforced >= window_size at runtime via enforce_min_lag()
ewacf_alpha: 0.5
ewacf_lambda: 0.5
ewacf_lag: 10
ewacf_threshold: 0.1

# Fixed hyperparameters
output_size: 1
epochs: 200
patience: 30

# Search grid
grid:
  hidden_size: [32]
  window_size: [10]
  bptt_steps: [50]
  lr: [0.001]
