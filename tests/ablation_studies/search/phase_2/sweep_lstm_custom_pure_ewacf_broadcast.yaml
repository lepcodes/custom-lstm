# ─── Sweep P-1: Custom LSTM Pure + EW-ACF Broadcast ────────────────────────
# Wide Search: Searching optimal core capacity AND EW-ACF regularization.

data_path: "C:\\Users\\Luis\\Documents\\ML-AI-Projects\\custom-lstm\\data\\preprocessed\\ethernet_traffic.csv"
experiment_name: "Phase 2"
architecture: "lstm_custom_pure"
data_mode: "pure"
loss_type: "ewacf_broadcast"

# Fixed hyperparameters
output_size: 1
epochs: 200
patience: 30

# Search grid (Wide search: 3x2x2 structural * 2x2 regularization = 48 runs)
grid:
  hidden_size: [32, 64, 128]
  lr: [0.001, 0.0001]
  bptt_steps: [50, 100]
  
  # EW-ACF Wide Search
  ewacf_alpha: [0.1, 0.5, 1.0]
  ewacf_lag: [1, 5, 10]
  ewacf_lambda: [0.5, 0.9]
  ewacf_threshold: [0.01, 0.1]
