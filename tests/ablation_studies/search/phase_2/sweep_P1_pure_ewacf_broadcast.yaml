# ─── Sweep P-1: Custom LSTM Pure + EW-ACF Broadcast ────────────────────────
# Usage: python sweep.py --config search/phase_2/sweep_P1_pure_ewacf_broadcast.yaml

data_path: "C:\\Users\\Luis\\Documents\\ML-AI-Projects\\custom-lstm\\data\\preprocessed\\ethernet_traffic.csv"
architecture: "lstm_custom_pure"
data_mode: "pure"
loss_type: "ewacf_broadcast"

# EW-ACF hyperparameters
ewacf_alpha: 0.5
ewacf_lambda: 0.5
ewacf_lag: 1
ewacf_threshold: 0.1

# Fixed hyperparameters
output_size: 1
epochs: 200
patience: 30

# Search grid
grid:
  hidden_size: [32]
  bptt_steps: [50]
  lr: [0.001]
