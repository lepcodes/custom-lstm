# ─── Sweep: LSTM Vanilla Pure ───────────────────────────────────────────────
# Usage: python sweep.py --config configs/sweep_lstm_vanilla_pure.yaml

data_path: "C:\\Users\\Luis\\Documents\\ML-AI-Projects\\custom-lstm\\data\\preprocessed\\ethernet_traffic.csv"
architecture: "lstm_vanilla_pure"
data_mode: "pure"

# Fixed hyperparameters
output_size: 1
epochs: 200
patience: 30

# Search grid (cartesian product)
grid:
  hidden_size: [16, 32, 64]
  bptt_steps: [25, 50, 100]
  lr: [0.01, 0.001, 0.0001]
