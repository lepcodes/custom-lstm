# ─── Sweep: LSTM Vanilla Windowed No Recurrence ────────────────────────────
# Usage: python sweep.py --config configs/sweep_lstm_vanilla_windowed_no_recurrence.yaml

data_path: "C:\\Users\\Luis\\Documents\\ML-AI-Projects\\custom-lstm\\data\\preprocessed\\ethernet_traffic.csv"
architecture: "lstm_vanilla_windowed_no_recurrence"
data_mode: "win"

# Fixed hyperparameters
output_size: 1
epochs: 200
patience: 30

# NOTE: input_size auto-set to window_size; sever_recurrence auto-injected
grid:
  hidden_size: [16, 32, 64]
  window_size: [10, 20, 40]
  lr: [0.01, 0.001, 0.0001]
